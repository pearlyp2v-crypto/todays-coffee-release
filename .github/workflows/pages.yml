name: Deploy coffee web app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: coffee-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public runtime only
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js build-manifest.json release.json .nojekyll _site/
          cp -R icons _site/icons
          if [ -d previews ]; then cp -R previews _site/previews; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
