name: Deploy coffee web app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: coffee-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public runtime only
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js build-manifest.json release.json .nojekyll _site/
          cp -R icons _site/icons
          if [ -d previews ]; then cp -R previews _site/previews; fi
          if [ -d reviews ]; then cp -R reviews _site/reviews; fi
      - name: Verify staged preview and review files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          for folder in ['previews', 'reviews']:
              root = Path(folder)
              if not root.is_dir():
                  continue
              files = [source for source in root.rglob('*') if source.is_file()]
              for source in files:
                  staged = Path('_site') / source
                  assert staged.is_file(), f'Missing staged file: {source}'
                  assert sha256(source.read_bytes()).digest() == sha256(staged.read_bytes()).digest(), f'Staged file differs: {source}'
              print(f'Verified {len(files)} staged {folder} files')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Wait for uploaded Pages artifact
        env:
          PAGES_READ_TOKEN: ${{ github.token }}
          PAGES_REPOSITORY: ${{ github.repository }}
          PAGES_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request
          repository = os.environ['PAGES_REPOSITORY']
          run_id = os.environ['PAGES_RUN_ID']
          expected = os.environ['PAGES_ARTIFACT_NAME']
          url = f'https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['PAGES_READ_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          for attempt in range(12):
              with urllib.request.urlopen(request, timeout=15) as response:
                  artifacts = json.load(response).get('artifacts', [])
              matches = [item for item in artifacts if item.get('name') == expected and not item.get('expired')]
              if len(matches) == 1:
                  print('Uploaded Pages artifact is available:', expected)
                  break
              if len(matches) > 1:
                  raise SystemExit('Duplicate artifact for this run attempt; refusing ambiguous deployment')
              if attempt == 11:
                  raise SystemExit('Uploaded Pages artifact did not become available; retry the workflow')
              print('Waiting for uploaded Pages artifact metadata...')
              time.sleep(5)
          PYTHON
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
